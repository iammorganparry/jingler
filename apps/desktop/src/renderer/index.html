<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!--
      The Connector Center derives provider logos from a favicon service:
      OpenConnector's catalog returns `iconUrl: null` for all ~1,100 providers but
      a `homepageUrl` for each, so the logo is `s2/favicons?domain=<host>`.

      BOTH origins are required. `www.google.com/s2/favicons` answers 301 and
      redirects to `t{0..3}.gstatic.com/faviconV2?…`, and CSP is enforced against
      the REDIRECT TARGET — allowing only google.com blocks every logo, which the
      component then reports as a load error and silently falls back to an
      initial-letter tile. Storybook has no CSP, so this failure is invisible
      there and only appears in the packaged renderer.

      Images only — no script, style or connect origin is widened.
    -->
    <!--
      `script-src` allows exactly one source beyond 'self': the
      `jingler-plugin:` scheme, which the main process registers and serves
      ONLY out of `~/jingler/plugins` (see main/plugin-protocol.ts). That is
      what lets a plugin's UI module be imported at all.

      What did NOT widen: `connect-src` (still 'self' via default-src), so a
      plugin's renderer half cannot reach the network however much code it
      runs — anything outbound goes through the extension host, where the
      operator's consent is recorded. No remote script origin is allowed, ever.
    -->
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; style-src 'self' 'unsafe-inline'; script-src 'self' 'sha256-lrDvDoT6FYa2mhYaXuzEP4sY9g0/IWo3npmzl1XD4TI=' jingler-plugin:; font-src 'self' data:; img-src 'self' data: blob: jingler-plugin: https://github.com https://*.githubusercontent.com https://www.google.com https://*.gstatic.com"
    />
    <title>Jingler</title>
    <!--
      Bare specifiers a plugin may import. Each resolves to a generated shim
      that re-exports the app's ALREADY-INSTANTIATED singleton rather than a
      second copy of the library.

      This is not an optimisation. Two Reacts in one tree makes every hook throw
      "invalid hook call", and the failure only appears once a SECOND plugin is
      installed — so without this a plugin author would ship something that
      worked perfectly on their machine and broke on everyone else's.
    -->
    <script type="importmap">
      {
        "imports": {
          "react": "jingler-plugin://runtime/react.js",
          "react-dom": "jingler-plugin://runtime/react-dom.js",
          "react/jsx-runtime": "jingler-plugin://runtime/jsx-runtime.js",
          "react/jsx-dev-runtime": "jingler-plugin://runtime/jsx-dev-runtime.js",
          "@jingler/plugin-sdk": "jingler-plugin://runtime/sdk.js",
          "@jingler/plugin-sdk/ui": "jingler-plugin://runtime/sdk-ui.js"
        }
      }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="./main.tsx"></script>
  </body>
</html>
