<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!--
      `https://www.google.com` is the favicon service the Connector Center derives
      provider logos from: OpenConnector's catalog returns `iconUrl: null` for all
      ~1,100 providers but a `homepageUrl` for each, so the logo is
      `s2/favicons?domain=<host>`. Images only — no script, style or connect
      origin is widened.
    -->
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; style-src 'self' 'unsafe-inline'; script-src 'self'; img-src 'self' data: https://github.com https://*.githubusercontent.com https://www.google.com"
    />
    <title>Starbase</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="./main.tsx"></script>
  </body>
</html>
