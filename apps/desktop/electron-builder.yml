# electron-builder — packages the electron-vite `out/` build into distributables
# and publishes them (+ the electron-updater `latest*.yml` channel files) to
# GitHub Releases. Run via `pnpm electron:pack` (local) / `pnpm electron:publish`
# (CI). See .github/workflows/release.yml for the release flow.
appId: app.jingler.desktop
productName: Jingler
copyright: Copyright © Jingler

directories:
  output: release
  buildResources: build-resources

# electron-builder WOULD auto-discover `build-resources/icon.{icns,ico,png}`,
# but naming them is worth the four lines: a silently-missing icon falls back to
# Electron's own default, which looks like a real icon and so never reads as a
# failure. Generated from the brand mark by `scripts/generate-brand-icons.py` —
# regenerate rather than hand-editing, so the macOS squircle grid stays right.
#
# `icon.png` is the full-bleed square (Windows/Linux convention). `icon.icns`
# carries the inset-in-a-1024-canvas variant macOS wants, because the system
# draws its own shadow into that margin.

# electron-vite emits main/preload/renderer under out/. electron-builder also
# includes the production `dependencies` node_modules automatically (effect,
# @effect/*, electron-updater, …), so they don't need listing here.
files:
  - out/**
  - package.json

# Official plugins. `builtinPluginsRoot()` (src/main/app-paths.ts) resolves to
# `resources/plugins` in a packaged build, so without this the packaged app looks
# for its bundled plugins in a directory that does not exist and ships NONE of
# them — the GitHub Issues tab simply is not there, with no error to explain it.
#
# Listed one by one rather than globbed from `plugins/*`:
#   - `plugins/examples/*` are teaching material and must not ship;
#   - a glob would also drag in `node_modules`, `src` and `vite.config.ts`.
# Adding an official plugin is therefore one deliberate edit here, which is the
# right amount of friction for "this now ships to every user".
#
# The `to` path's last segment MUST equal the manifest's `id` — discovery reads
# directory names and `PluginRegistry.dirFor` resolves `<root>/<id>`, so a
# mismatch makes the plugin load but Reveal open nothing.
#
# `dist/**` assumes the plugin has been BUILT. `pnpm build` (turbo) covers it:
# `plugins/*` is in pnpm-workspace.yaml and each plugin has a `build` script.
extraResources:
  # Linux window/taskbar icon. `linux.icon` above dresses the AppImage and the
  # .desktop entry, but the RUNNING window's icon comes from `BrowserWindow`,
  # which needs a real file on disk outside the asar — so the same PNG ships
  # twice on purpose. See `windowIcon()` in src/main/index.ts.
  - from: build-resources/icon.png
    to: icon.png
  - from: ../../plugins/github-issues
    to: plugins/github-issues
    filter:
      - jingler.plugin.json
      - dist/**
      - "!dist/**/*.map"

# The one native module — @homebridge/node-pty-prebuilt-multiarch — must live
# OUTSIDE the asar so its `.node` binary can be dlopen'd at runtime (asar-packed
# native addons can't be loaded). Unpack the whole package (it also spawns a
# `conpty`/`winpty` helper on Windows that must be a real file on disk).
asarUnpack:
  - "**/node_modules/@homebridge/node-pty-prebuilt-multiarch/**"

# node-pty-prebuilt-multiarch ships N-API prebuilt binaries (one ABI across Node
# + Electron), so there is nothing to compile — never let electron-builder
# rebuild against the pnpm workspace symlink tree.
npmRebuild: false
buildDependenciesFromSource: false

# GitHub Releases doubles as the auto-update feed (electron-updater reads the
# latest*.yml channel files published here).
publish:
  provider: github
  owner: iammorganparry
  repo: jingler

mac:
  icon: build-resources/icon.icns
  category: public.app-category.developer-tools
  target:
    - target: dmg
      arch: [arm64, x64]
    # zip is required by electron-updater on macOS (dmg is first-install only).
    - target: zip
      arch: [arm64, x64]
  hardenedRuntime: true
  gatekeeperAssess: false
  entitlements: build-resources/entitlements.mac.plist
  entitlementsInherit: build-resources/entitlements.mac.plist

win:
  icon: build-resources/icon.ico
  target:
    - target: nsis
      arch: [x64]
  # No Authenticode cert yet; without this electron-updater would reject the
  # unsigned installer and silently break Windows auto-update. Remove once signed.
  verifyUpdateCodeSignature: false

nsis:
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true

linux:
  icon: build-resources/icon.png
  category: Development
  target:
    - target: AppImage
      arch: [x64]
    - target: deb
      arch: [x64]
  artifactName: ${productName}-${version}-${arch}.${ext}
