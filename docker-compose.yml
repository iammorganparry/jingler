# Local dev services for Jingler.
#   docker compose up -d              # everything (Postgres + OpenConnector)
#   docker compose up -d db           # just the auth backend's Postgres
#   docker compose up -d open-connector
#
# Auth Postgres: `pnpm --filter @jingler/server db:migrate` after `up -d db`.
# Port 5433 avoids clashing with any host Postgres on the default 5432.
services:
  db:
    image: postgres:16-alpine
    container_name: jingler-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: jingler
    ports:
      - "5433:5432"
    volumes:
      - jingler-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d jingler"]
      interval: 5s
      timeout: 5s
      retries: 10

  # Self-hosted OpenConnector — the ONE central MCP store every agent draws from.
  # Console + API at http://localhost:3000, MCP endpoint at http://localhost:3000/mcp.
  # Boots with zero setup via the dev defaults below; in Jingler, open
  # Settings > Unified MCP and paste: endpoint http://localhost:3000, token below.
  # Deeper self-hosting notes live in infra/open-connector/README.md.
  open-connector:
    image: ghcr.io/oomol-lab/open-connector:latest
    container_name: jingler-open-connector
    restart: unless-stopped
    ports:
      # Bound to LOOPBACK, not 0.0.0.0. `OPEN_CONNECTOR_API_TOKEN` is not enforced
      # by this image — `curl` with a wrong bearer, or none at all, gets 200 — so
      # publishing 3000 on every interface served every credential connected here
      # (Slack, GitHub, …) to anything on the same network.
      - "127.0.0.1:3000:3000"
    environment:
      # Dev defaults — override in a real deployment. Not secret for local use.
      OPEN_CONNECTOR_ENCRYPTION_KEY: ${OPEN_CONNECTOR_ENCRYPTION_KEY:-dev-encryption-key-change-me}
      OPEN_CONNECTOR_API_TOKEN: ${OPEN_CONNECTOR_API_TOKEN:-local-dev-token}
      OPEN_CONNECTOR_BASE_URL: ${OPEN_CONNECTOR_BASE_URL:-http://localhost:3000}
    volumes:
      # SQLite lives here — connected providers survive a restart.
      - jingler-open-connector-data:/data
    healthcheck:
      # 127.0.0.1, NOT localhost. Inside this image /etc/hosts maps localhost to
      # ::1 only, while the server binds IPv4 — so `wget http://localhost:3000`
      # is refused on every probe and the container sits permanently unhealthy
      # while serving fine on the published port. Cosmetic until something waits
      # on `condition: service_healthy`, which would then hang forever.
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:3000/openapi.json"]
      interval: 30s
      timeout: 5s
      retries: 5

volumes:
  jingler-db-data:
  jingler-open-connector-data:
