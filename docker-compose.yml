# Local dev services for Jingler.
#   docker compose up -d              # everything
#   docker compose up -d db           # just the auth backend's Postgres
#
# Auth Postgres: `pnpm --filter @jingler/server db:migrate` after `up -d db`.
# Port 5433 avoids clashing with any host Postgres on the default 5432.
services:
  db:
    image: postgres:16-alpine
    container_name: jingler-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: jingler
    ports:
      - "5433:5432"
    volumes:
      - jingler-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d jingler"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  jingler-db-data:
