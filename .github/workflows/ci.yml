name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    name: Lint, typecheck & unit tests
    runs-on: [self-hosted, macOS, ARM64, jingler]
    steps:
      - uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.7.0

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Biome runs first, then Oxlint's cyclomatic-complexity gate. The formatter
      # stays disabled; see biome.json.
      - name: Lint
        run: pnpm lint

      - name: Typecheck
        env:
          BETTER_AUTH_SECRET: ci-only-better-auth-placeholder-at-least-32-bytes
          BETTER_AUTH_URL: https://ci.invalid
          CRON_SECRET: ci-only-cron-placeholder-at-least-32-bytes
        run: pnpm typecheck

      # Unit + integration tests (Vitest). The full Electron Playwright suite is
      # a required local pre-PR gate; keeping it out of routine CI avoids a
      # heavyweight desktop build and browser runtime on every push.
      - name: Test
        env:
          VITEST_MAX_WORKERS: 4
        run: pnpm test

      - name: Deterministic pi behavior contract
        run: pnpm --filter @jingler/cli-adapters eval:pi:deterministic

      - name: Production license policy
        run: pnpm license:check

  electron:
    name: Electron package gates
    runs-on: [self-hosted, macOS, ARM64, jingler]
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.7.0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Build unpacked desktop artifact
        run: pnpm --filter @jingler/desktop dist
      - name: Locate packaged resources
        run: |
          resources="$(find apps/desktop/release -type d -path '*/Jingler.app/Contents/Resources' -print -quit)"
          test -n "$resources"
          echo "JINGLER_DESKTOP_ASAR=$resources/app.asar" >> "$GITHUB_ENV"
          echo "JINGLER_DESKTOP_RESOURCES=$resources" >> "$GITHUB_ENV"
          echo "JINGLER_DEVICE_BUNDLE=$resources/device-agent/jingler-device-runtime.tgz" >> "$GITHUB_ENV"
      - name: Inspect desktop and device artifacts
        run: pnpm artifacts:check
