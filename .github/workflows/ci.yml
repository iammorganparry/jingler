name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    name: Lint, typecheck & unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.7.0

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Biome, linter only (the formatter is deliberately disabled — see
      # biome.json). Errors are the correctness + suspicious rules, which flag
      # real bugs; a11y/style/complexity report as warnings and do not gate.
      # Runs FIRST because it is the fastest signal by an order of magnitude.
      - name: Lint
        run: pnpm lint

      - name: Typecheck
        env:
          BETTER_AUTH_SECRET: ci-only-better-auth-placeholder-at-least-32-bytes
          BETTER_AUTH_URL: https://ci.invalid
          CRON_SECRET: ci-only-cron-placeholder-at-least-32-bytes
          MEMORY_ENABLED: "false"
          MEMORY_GRANT_SECRET: ci-only-memory-grant-placeholder
          MEMORY_WORKER_SERVICE_SECRET: ci-only-memory-worker-placeholder
        run: pnpm typecheck

      # Unit + integration tests (Vitest). The full Electron Playwright suite is
      # a required local pre-PR gate; keeping it out of routine CI avoids a
      # heavyweight desktop build and browser runtime on every push.
      - name: Test
        run: pnpm test

      - name: Deterministic pi behavior contract
        run: pnpm --filter @jingler/cli-adapters eval:pi:deterministic

      - name: Production license policy
        run: pnpm license:check

  electron:
    name: Electron package gates
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.7.0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Build unpacked desktop artifact
        run: pnpm --filter @jingler/desktop dist
      - name: Inspect desktop and device artifacts
        env:
          JINGLER_DESKTOP_ASAR: apps/desktop/release/linux-unpacked/resources/app.asar
          JINGLER_DESKTOP_RESOURCES: apps/desktop/release/linux-unpacked/resources
          JINGLER_DEVICE_BUNDLE: apps/desktop/release/linux-unpacked/resources/device-agent/jingler-device.mjs
        run: pnpm artifacts:check
