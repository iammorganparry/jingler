name: Release

# Cut a release from main, by hand. Gate → version+tag → per-platform build →
# one GitHub Release. Requires at least one pending changeset (pnpm changeset)
# and a reviewed provider-certification run for the exact commit.
on:
  workflow_dispatch:
    inputs:
      native_certification_run_id:
        description: Successful native-runtime-certification workflow for this exact commit
        required: true
        type: string
      certification_run_id:
        description: Successful pi-provider-evals workflow run for this exact commit
        required: true
        type: string

permissions:
  contents: write
  actions: read

jobs:
  # Nothing ships unless typecheck + tests are green.
  gate:
    name: Gate (typecheck + tests)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.7.0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm --filter @jingler/cli-adapters eval:pi:deterministic
      - run: pnpm license:check
      - name: Require reviewed live certification for this commit
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CERTIFICATION_RUN_ID: ${{ inputs.certification_run_id }}
        run: |
          test "$(gh run view "$CERTIFICATION_RUN_ID" --json conclusion --jq .conclusion)" = "success"
          test "$(gh run view "$CERTIFICATION_RUN_ID" --json headSha --jq .headSha)" = "$GITHUB_SHA"
          gh run download "$CERTIFICATION_RUN_ID" --name pi-provider-certification --dir .artifacts/pi-certification
      - name: Require all six native certifications for this commit
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NATIVE_RUN_ID: ${{ inputs.native_certification_run_id }}
        run: |
          test "$(gh run view "$NATIVE_RUN_ID" --json conclusion --jq .conclusion)" = "success"
          test "$(gh run view "$NATIVE_RUN_ID" --json headSha --jq .headSha)" = "$GITHUB_SHA"
          test "$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$NATIVE_RUN_ID" --jq .path)" = ".github/workflows/native-runtime-certification.yml"
          gh run download "$NATIVE_RUN_ID" --pattern 'native-*' --dir .artifacts/native-download
          mkdir -p .artifacts/native-certification
          for runtime in claude codex opencode; do
            for version in minimum current; do
              cp ".artifacts/native-download/native-$runtime-$version/$runtime-$version.json" .artifacts/native-certification/
            done
          done
          node scripts/check-native-certification.mjs .artifacts/native-certification "$GITHUB_SHA"
      - name: Revalidate reviewed release manifest inputs
        env:
          JINGLER_RELEASE_CANDIDATES: ${{ github.workspace }}/config/pi-release-candidates.json
          JINGLER_RELEASE_CERTIFICATIONS: ${{ github.workspace }}/.artifacts/pi-certification/certifications.json
          JINGLER_RELEASE_MANIFEST: ${{ github.workspace }}/.artifacts/pi-certification/revalidated-manifest.json
        run: pnpm --filter @jingler/cli-adapters eval:pi:release-manifest
      - name: Install Electron runtime dependencies
        run: pnpm --filter @jingler/desktop exec playwright install --with-deps chromium
      - name: Electron end-to-end behavior contract
        run: xvfb-run -a pnpm --filter @jingler/desktop e2e

  # Apply pending changesets, bump every @jingler/* package in lockstep, sync the
  # root version, commit `release: vX.Y.Z`, tag, and push both back to main.
  version:
    name: Version & tag
    needs: gate
    runs-on: ubuntu-latest
    concurrency:
      group: release-version
      cancel-in-progress: false
    outputs:
      version: ${{ steps.bump.outputs.version }}
      tag: ${{ steps.bump.outputs.tag }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.RELEASE_TOKEN || secrets.GITHUB_TOKEN }}
      - uses: pnpm/action-setup@v4
        with:
          version: 10.7.0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Require a pending changeset
        run: |
          if [ -z "$(find .changeset -maxdepth 1 -name '*.md' ! -name 'README.md')" ]; then
            echo "::error::No changesets found — add one with 'pnpm changeset' before releasing."
            exit 1
          fi
      - name: Version, commit, tag, push
        id: bump
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          pnpm version-packages
          VERSION=$(node -p "require('./apps/desktop/package.json').version")
          TAG="v$VERSION"
          git add -A
          git commit -m "release: $TAG"
          git tag "$TAG"
          git push origin HEAD:main
          git push origin "$TAG"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"

  # Build native installers without requiring signing credentials. When the
  # complete Apple secret set exists, macOS builds are signed and notarized;
  # otherwise they remain installable through macOS's normal manual override.
  build:
    name: Build ${{ matrix.label }}
    needs: version
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: macOS arm64
            os: macos-14
            args: "--mac --arm64"
            artifact: desktop-mac-arm64
          - label: macOS x64
            os: macos-15-intel
            args: "--mac --x64"
            artifact: desktop-mac-x64
          - label: Linux x64
            os: ubuntu-22.04
            args: "--linux --x64"
            artifact: desktop-linux-x64
          - label: Windows x64
            os: windows-latest
            args: "--win --x64"
            artifact: desktop-win-x64
    runs-on: ${{ matrix.os }}
    env:
      APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
      APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
      APPLE_API_KEY_P8: ${{ secrets.APPLE_API_KEY_P8 }}
      APPLE_API_KEY_ID_SECRET: ${{ secrets.APPLE_API_KEY_ID }}
      APPLE_API_ISSUER_SECRET: ${{ secrets.APPLE_API_ISSUER }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.version.outputs.tag }}
      - uses: pnpm/action-setup@v4
        with:
          version: 10.7.0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile

      - name: Embed reviewed provider certifications
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CERTIFICATION_RUN_ID: ${{ inputs.certification_run_id }}
        run: |
          mkdir -p .artifacts/pi-certification
          gh run download "$CERTIFICATION_RUN_ID" --name pi-provider-certification --dir .artifacts/pi-certification
          cp .artifacts/pi-certification/release-manifest.json packages/core/src/runtime/release-certification-manifest.json
          node -e 'const manifest = require("./packages/core/src/runtime/release-certification-manifest.json"); if (!Array.isArray(manifest.models) || manifest.models.length === 0) throw new Error("Release certification manifest has no selectable models")'

      - name: Build bundled resources
        run: |
          pnpm --filter @jingler/desktop run build:bundled-plugins
          pnpm --filter @jingler/desktop run build:device-agent
          node apps/desktop/scripts/materialize-plannotator-ext.mjs
          pnpm --filter @jingler/desktop run build

      - name: Package desktop installers
        shell: bash
        run: |
          if [[ "$RUNNER_OS" == "macOS" ]] &&
             [[ -n "$APPLE_CERTIFICATE" ]] &&
             [[ -n "$APPLE_CERTIFICATE_PASSWORD" ]] &&
             [[ -n "$APPLE_API_KEY_P8" ]] &&
             [[ -n "$APPLE_API_KEY_ID_SECRET" ]] &&
             [[ -n "$APPLE_API_ISSUER_SECRET" ]]; then
            mkdir -p "$RUNNER_TEMP/asc"
            printf '%s' "$APPLE_API_KEY_P8" | base64 --decode > "$RUNNER_TEMP/asc/AuthKey.p8"
            export CSC_LINK="$APPLE_CERTIFICATE"
            export CSC_KEY_PASSWORD="$APPLE_CERTIFICATE_PASSWORD"
            export APPLE_API_KEY="$RUNNER_TEMP/asc/AuthKey.p8"
            export APPLE_API_KEY_ID="$APPLE_API_KEY_ID_SECRET"
            export APPLE_API_ISSUER="$APPLE_API_ISSUER_SECRET"
            echo "macOS signing and notarization enabled."
          else
            unset CSC_LINK CSC_KEY_PASSWORD APPLE_API_KEY APPLE_API_KEY_ID APPLE_API_ISSUER
            echo "Building unsigned installers."
          fi
          pnpm --filter @jingler/desktop exec electron-builder ${{ matrix.args }} --publish never

      - name: Inspect desktop and device artifacts
        shell: bash
        run: |
          ASAR_PATH=$(find apps/desktop/release -type f -name app.asar | head -n 1)
          RESOURCES_PATH=$(dirname "$ASAR_PATH")
          JINGLER_DESKTOP_ASAR="$ASAR_PATH" \
          JINGLER_DESKTOP_RESOURCES="$RESOURCES_PATH" \
          JINGLER_DEVICE_BUNDLE="$RESOURCES_PATH/device-agent/jingler-device-runtime.tgz" \
          pnpm artifacts:check

      - name: Collect release files
        shell: bash
        run: |
          mkdir -p .artifacts/release
          find apps/desktop/release -maxdepth 1 -type f \
            ! -name 'builder-debug.yml' \
            -exec cp {} .artifacts/release/ \;
          test -n "$(find .artifacts/release -type f -print -quit)"

      - name: Upload release files
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: .artifacts/release/*
          if-no-files-found: error

  # Publish only after every native installer passed the packaged-artifact check.
  publish:
    name: Publish release
    needs: [version, build]
    runs-on: ubuntu-latest
    steps:
      - name: Download release files
        uses: actions/download-artifact@v4
        with:
          pattern: desktop-*
          path: release-assets

      - name: Assemble release assets
        shell: bash
        run: |
          mkdir publish-assets
          find release-assets -type f ! -name 'latest-mac.yml' -exec cp {} publish-assets/ \;

          arm=release-assets/desktop-mac-arm64/latest-mac.yml
          intel=release-assets/desktop-mac-x64/latest-mac.yml
          test "$(sed -n 's/^version: //p' "$arm")" = "$(sed -n 's/^version: //p' "$intel")"
          {
            sed -n '1,/^files:/p' "$arm"
            sed -n '/^files:/,/^path:/p' "$arm" | sed '1d;$d'
            sed -n '/^files:/,/^path:/p' "$intel" | sed '1d;$d'
            sed -n '/^path:/,$p' "$arm"
          } > publish-assets/latest-mac.yml
          test "$(grep -c '^  - url:' publish-assets/latest-mac.yml)" -ge 4

      - name: Create or update GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ needs.version.outputs.tag }}
        shell: bash
        run: |
          if ! gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release create "$TAG" \
              --repo "$GITHUB_REPOSITORY" \
              --verify-tag \
              --generate-notes \
              --title "Jingler $TAG" \
              --draft
          fi
          gh release upload "$TAG" publish-assets/* --repo "$GITHUB_REPOSITORY" --clobber
          gh release edit "$TAG" --repo "$GITHUB_REPOSITORY" --draft=false --latest
